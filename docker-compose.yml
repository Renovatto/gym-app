# Postgres de desenvolvimento local, para bater com o banco de producao (Lightsail).
# Porta 5434 (nao a 5432 padrao) para nao colidir com outro Postgres que voce suba
# por outro motivo - inclusive outro projeto seu que ja usa a 5433 nesta maquina.
# Ver README.md > Configuracao do backend.
#
# "name" fixo: sem isso o Docker Compose nomeia o volume a partir do diretorio de
# onde o comando roda, e "docker compose up" de dois lugares diferentes criaria
# dois bancos separados em vez de reusar o mesmo.
name: gymapp

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymapp
      POSTGRES_PASSWORD: gymapp
      POSTGRES_DB: gymapp
    ports:
      - "5434:5432"
    volumes:
      - gymapp-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gymapp-db:
