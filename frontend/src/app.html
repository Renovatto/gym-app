<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!--
			PWA: com o manifest + os metas abaixo, "Adicionar a Tela de Inicio" no iOS
			instala o app em tela cheia (sem a barra do Safari), com icone e nome
			proprios. Nenhum passo de build: o manifest e os icones sao estaticos.
		-->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!--
			apple-mobile-web-app-capable e o que faz o iOS abrir em tela cheia; o
			mobile-web-app-capable e o equivalente padronizado (Android/Chrome).
			Os dois precisam estar aqui enquanto o iOS nao migrar.
		-->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="GymApp" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<!--
			Tela de abertura (splash) do iOS. O Android monta a dele sozinho a partir do
			manifest; o iOS so mostra splash se existir uma imagem no tamanho EXATO do
			aparelho - por isso a lista abaixo, uma linha por resolucao. Sem ela, a
			abertura fica em branco ate o app pintar. So retrato: o app e retrato.
		-->
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
			href="/splash/splash-750x1334.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1242x2208.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1125x2436.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
			href="/splash/splash-828x1792.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1242x2688.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1170x2532.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1284x2778.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1179x2556.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1290x2796.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1206x2622.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1320x2868.png"
		/>

		<!--
			Cor da barra de status / barra do navegador. Segue o tema do aparelho:
			slate-50 no claro e ink no escuro, os mesmos tokens do layout.css.
		-->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<!--
			Animacao da abertura. Mora aqui, e nao no layout.css, porque nesta SPA o CSS
			do app so chega junto com o JS - e a tela estatica abaixo precisa estar
			animada antes disso. Como este <style> fica no head, o BootScreen do Svelte
			usa as mesmas classes depois: uma fonte so para as duas telas.

			Roteiro de 4,4s: a barra entra rolando, os discos encaixam, vem o esforco
			(agacha, treme, a barra enverga) e fecha no batimento. Quem rola e a barra
			SOZINHA: se o halter entrasse montado, a montagem seguinte se contradiria.
		-->
		<style>
			.boot-mark { width: 39vw; max-width: 200px; }
			.boot-mark rect { fill: #10b981; }
			.boot-lift, .boot-beat, .boot-roll, .boot-flex-e, .boot-flex-d {
				transform-box: fill-box;
				transform-origin: center;
			}

			.boot-lift { animation: boot-lift 4.4s ease-in-out infinite; }
			.boot-beat { animation: boot-beat 4.4s ease-out infinite; }
			.boot-roll { animation: boot-roll 4.4s cubic-bezier(0.25, 1.05, 0.4, 1) infinite; }
			.boot-plate-oe, .boot-plate-ie { animation: boot-left 4.4s cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
			.boot-plate-od, .boot-plate-id { animation: boot-right 4.4s cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
			.boot-flex-e { animation: boot-flex-e 4.4s ease-in-out infinite; }
			.boot-flex-d { animation: boot-flex-d 4.4s ease-in-out infinite; }

			/* --boot-offset deixa o BootScreen continuar o ciclo de onde esta tela parou,
			   em vez de recomecar do zero quando o Svelte assume (ver BootScreen.svelte). */
			.boot-lift, .boot-beat, .boot-roll, .boot-flex-e, .boot-flex-d,
			.boot-plate-oe, .boot-plate-od { animation-delay: var(--boot-offset, 0s); }
			/* os discos de dentro entram um tico depois dos de fora */
			.boot-plate-ie, .boot-plate-id { animation-delay: calc(var(--boot-offset, 0s) + 0.1s); }

			@keyframes boot-roll {
				0% { transform: translateX(-300px) rotate(-720deg); opacity: 1; }
				20%, 94% { transform: translateX(0) rotate(0deg); opacity: 1; }
				100% { transform: translateX(0) rotate(0deg); opacity: 0; }
			}
			@keyframes boot-left {
				0%, 20% { transform: translateX(-75px); opacity: 0; }
				34%, 92% { transform: translateX(0); opacity: 1; }
				100% { transform: translateX(-75px); opacity: 0; }
			}
			@keyframes boot-right {
				0%, 20% { transform: translateX(75px); opacity: 0; }
				34%, 92% { transform: translateX(0); opacity: 1; }
				100% { transform: translateX(75px); opacity: 0; }
			}
			/* o tremor e curto e irregular: e o que separa esforco de enfeite */
			@keyframes boot-lift {
				0%, 34% { transform: translate(0, 0); }
				40% { transform: translate(0, 9%); }
				45% { transform: translate(-1.5%, 8.6%); }
				49% { transform: translate(1.5%, 8%); }
				53% { transform: translate(-1%, 4%); }
				58% { transform: translate(1%, -6%); }
				62%, 72% { transform: translate(0, -12%); }
				78%, 100% { transform: translate(0, 0); }
			}
			/* discos caem nas pontas enquanto a carga esta em cima: a barra enverga */
			@keyframes boot-flex-e {
				0%, 40% { transform: translateY(0) rotate(0deg); }
				46%, 58% { transform: translateY(7px) rotate(-3deg); }
				70%, 100% { transform: translateY(0) rotate(0deg); }
			}
			@keyframes boot-flex-d {
				0%, 40% { transform: translateY(0) rotate(0deg); }
				46%, 58% { transform: translateY(7px) rotate(3deg); }
				70%, 100% { transform: translateY(0) rotate(0deg); }
			}
			@keyframes boot-beat {
				0%, 78% { transform: scale(1); }
				82% { transform: scale(1.11); }
				86% { transform: scale(1); }
				90% { transform: scale(1.06); }
				94%, 100% { transform: scale(1); }
			}

			@media (prefers-reduced-motion: reduce) {
				.boot-lift, .boot-beat, .boot-roll, .boot-flex-e, .boot-flex-d,
				.boot-plate-oe, .boot-plate-od, .boot-plate-ie, .boot-plate-id {
					animation: none;
				}
			}
		</style>

		<!--
			Tela de abertura estatica: cobre a janela entre o splash do sistema (que o iOS
			tira no primeiro pixel pintado) e o momento em que o Svelte monta. Sem ela
			aparece um frame claro no meio da abertura. O layout remove este elemento
			assim que assume - a partir dai quem pinta a espera e o BootScreen, com a
			mesma arte, para a troca ser invisivel.
		-->
		<div
			id="boot-screen"
			style="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0f172a"
		>
			<svg viewBox="96 180 320 152" class="boot-mark" aria-hidden="true">
				<g class="boot-lift">
					<g class="boot-beat">
						<g class="boot-plate-oe"><rect class="boot-flex-e" x="96" y="206" width="32" height="100" rx="12" /></g>
						<g class="boot-plate-ie"><rect class="boot-flex-e" x="136" y="180" width="40" height="152" rx="14" /></g>
						<g class="boot-roll"><rect x="176" y="238" width="160" height="36" rx="18" /></g>
						<g class="boot-plate-id"><rect class="boot-flex-d" x="336" y="180" width="40" height="152" rx="14" /></g>
						<g class="boot-plate-od"><rect class="boot-flex-d" x="384" y="206" width="32" height="100" rx="12" /></g>
					</g>
				</g>
			</svg>
		</div>

		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
