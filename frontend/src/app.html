<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!--
			PWA: com o manifest + os metas abaixo, "Adicionar a Tela de Inicio" no iOS
			instala o app em tela cheia (sem a barra do Safari), com icone e nome
			proprios. Nenhum passo de build: o manifest e os icones sao estaticos.
		-->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!--
			apple-mobile-web-app-capable e o que faz o iOS abrir em tela cheia; o
			mobile-web-app-capable e o equivalente padronizado (Android/Chrome).
			Os dois precisam estar aqui enquanto o iOS nao migrar.
		-->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="GymApp" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<!--
			Tela de abertura (splash) do iOS. O Android monta a dele sozinho a partir do
			manifest; o iOS so mostra splash se existir uma imagem no tamanho EXATO do
			aparelho - por isso a lista abaixo, uma linha por resolucao. Sem ela, a
			abertura fica em branco ate o app pintar. So retrato: o app e retrato.
		-->
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
			href="/splash/splash-750x1334.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1242x2208.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1125x2436.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
			href="/splash/splash-828x1792.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1242x2688.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1170x2532.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1284x2778.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1179x2556.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1290x2796.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1206x2622.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="/splash/splash-1320x2868.png"
		/>

		<!--
			Cor da barra de status / barra do navegador. Segue o tema do aparelho:
			slate-50 no claro e ink no escuro, os mesmos tokens do layout.css.
		-->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<!--
			Tela de abertura estatica: cobre a janela entre o splash do sistema (que o iOS
			tira no primeiro pixel pintado) e o momento em que o Svelte monta. Sem ela
			aparece um frame claro no meio da abertura. O layout remove este elemento
			assim que assume - a partir dai quem pinta a espera e o BootScreen, com a
			mesma arte, para a troca ser invisivel.
		-->
		<div
			id="boot-screen"
			style="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0f172a"
		>
			<svg viewBox="96 180 320 152" style="width:39vw;max-width:200px" fill="#10b981" aria-hidden="true">
				<rect x="96" y="206" width="32" height="100" rx="12" />
				<rect x="136" y="180" width="40" height="152" rx="14" />
				<rect x="176" y="238" width="160" height="36" rx="18" />
				<rect x="336" y="180" width="40" height="152" rx="14" />
				<rect x="384" y="206" width="32" height="100" rx="12" />
			</svg>
		</div>

		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
